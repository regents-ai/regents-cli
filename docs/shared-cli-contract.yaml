version: 1
product: shared-services
x-regent-capability:
  status: beta
  owner: shared-services
  money_path: true
  cli_surface: true
  mobile_surface: false
help:
  story: >
    A Regent identity is a saved Agent account. An Agent account is a wallet plus
    registry address plus token ID. Protected shared commands use
    `regents auth login --audience regent-services`, then `regents identity ensure`,
    then the command.
  bare_invocation: >
    Running `regents` with no arguments prints a short readiness summary
    (local runtime, wallet, identity, saved sign-ins, and Fold state when
    active) followed by one line pointing to `regents --help`.
  failure_next_step: >
    When a command fails and its contract metadata carries a next_step, the
    shared error output prints `Next: <step>` with the error. Errors that
    already carry their own next steps keep them.
  output_modes:
    human: Panels, tables, status lines, examples, and next-step hints.
    json: Raw JSON for scripts when `--json` is supported or stdout is not a terminal.
  terminal_constraints:
    - Honor NO_COLOR.
    - Avoid rich formatting for non-TTY output and TERM=dumb.
    - Keep command-level help scoped to the requested command group.
x-regent-chat-room-contract:
  owner: regents-cli
  local_xmtp_authority: CLI owns local XMTP identity, local policy files, and raw XMTP group operations.
  product_room_authority: Product room keys and membership rules stay in Platform, Autolaunch, and Techtree contracts.
  thread_identifier_boundary:
    xmtp_group_commands: conversation_id
    techtree_chat_commands: "Techtree chat scopes: system, topic:<slug>, node:<node-id>"
  transport_boundary: >-
    CLI xmtp commands manage local XMTP transport. CLI techtree chat commands use
    Techtree chat routes or local runtime transport; node-room writes and DMs go
    over the local XMTP runtime.
command_groups:
  - name: operator
    interface: runtime
    auth_mode: none
    output_envelope: operator-status-envelopes
    agent_metadata:
      category: local-control
      prompt_behavior: never_prompt
      json_support: supported
      mutation_class: local-read-or-write
      retry_behavior: safe_for_reads
      pagination: bounded
      async_behavior: synchronous
      input_mode: args-and-flags
      examples:
        - regents status
        - regents init
        - regents plugin install
        - regents setup
        - regents setup skills
        - regents plugin status
        - regents runtime status --json
        - regents agent-context
        - regents config get
        - regents agent profile get
      commands:
        regents init:
          category: local-setup
          prompt_behavior: never_prompt
          json_support: supported
          mutation_class: local-write
          retry_behavior: safe
          pagination: none
          async_behavior: synchronous
          input_mode: flags
          summary: Set up Regent on this machine and report what is ready.
          next_step: regents status
          examples:
            - regents init
        start:
          category: local-setup
          prompt_behavior: never_prompt
          json_support: supported
          mutation_class: local-read-or-write
          retry_behavior: safe_for_reads
          pagination: none
          async_behavior: synchronous
          input_mode: flags
          summary: Open the first-run Techtree start flow. Alias for regents techtree start.
          next_step: regents techtree work next --json
          examples:
            - regents start
        settings:
          category: local-setup
          prompt_behavior: never_prompt
          json_support: supported
          mutation_class: local-read
          retry_behavior: safe
          pagination: none
          async_behavior: synchronous
          input_mode: flags
          summary: Show local Regent configuration. Alias for regents config get.
          next_step: regents config write --input @config.json
          examples:
            - regents settings
        setup:
          category: local-setup
          prompt_behavior: never_prompt
          json_support: supported
          mutation_class: local-read
          retry_behavior: safe
          pagination: none
          async_behavior: synchronous
          input_mode: flags
          next_step: regents plugin status
          examples:
            - regents setup
            - regents setup --runtime hermes
        setup skills:
          category: local-setup
          prompt_behavior: never_prompt
          json_support: supported
          mutation_class: local-write
          retry_behavior: safe
          pagination: none
          async_behavior: synchronous
          input_mode: flags
          examples:
            - regents setup skills
            - regents setup skills --project
        run:
          category: local-control
          prompt_behavior: never_prompt
          json_support: supported
          mutation_class: local-process
          retry_behavior: start_once_keep_running
          pagination: none
          async_behavior: long_running
          input_mode: flags
          next_step: regents techtree work next --json
          examples:
            - regents run
            - regents run --fold autoresearch
            - regents run --json
        plugin status:
          category: local-setup
          prompt_behavior: never_prompt
          json_support: supported
          mutation_class: local-read
          retry_behavior: safe
          pagination: none
          async_behavior: synchronous
          input_mode: flags
          next_step: regents plugin install
          examples:
            - regents plugin status
        plugin install:
          category: local-setup
          prompt_behavior: confirm_before_write
          json_support: supported
          mutation_class: local-write
          retry_behavior: safe
          pagination: none
          async_behavior: synchronous
          input_mode: flags
          next_step: regents plugin doctor
          examples:
            - regents plugin install
            - regents plugin install --runtime hermes
            - regents plugin install --runtime openclaw
        plugin doctor:
          category: diagnostics
          prompt_behavior: never_prompt
          json_support: supported
          mutation_class: local-read
          retry_behavior: safe
          pagination: none
          async_behavior: synchronous
          input_mode: flags
          next_step: regents run
          examples:
            - regents plugin doctor
    commands:
      - init
      - start
      - settings
      - status
      - whoami
      - agent-context
      - setup
      - setup skills
      - plugin status
      - plugin install
      - plugin doctor
      - run
      - config get
      - config write
      - agent init
      - agent status
      - agent profile list
      - agent profile get
      - agent harness list
      - gossipsub status
    flags:
      whoami:
        - name: --full
          type: boolean
          required: false
          description: Include the saved Platform account projection when a Platform session is present.
      setup skills:
        - name: --project
          type: boolean
          required: false
          description: Install skills into the current project instead of the global user skill set.
        - name: --json
          type: boolean
          required: false
          description: Print the installed skill summary as JSON.
      setup:
        - name: --runtime
          type: enum
          enum: [auto, hermes, openclaw]
          required: false
          description: Local agent runtime to inspect before starting. Defaults to auto, which inspects both Hermes and OpenClaw. This reports readiness only; it does not install the Hermes or OpenClaw Regent tools.
      run:
        - name: --json
          type: boolean
          required: false
          description: Print the local runtime summary as JSON.
        - name: --fold
          type: enum
          enum: [starter, autoresearch, bbh-public-v1]
          required: false
          description: Start Regent with a proof-producing Techtree Fold track.
      plugin status:
        - name: --runtime
          type: enum
          enum: [auto, hermes, openclaw]
          required: false
          description: Runtime to inspect. Defaults to auto, which inspects both Hermes and OpenClaw. Use hermes or openclaw when checking whether one specific agent app can see Regent.
      plugin install:
        - name: --runtime
          type: enum
          enum: [auto, hermes, openclaw]
          required: false
          description: Runtime that should receive the Regent tools. Defaults to auto, which installs both. Use hermes for a Hermes agent or openclaw for an OpenClaw agent. Hermes setup also selects xAI Grok OAuth with grok-4.3 and returns the Hermes sign-in command.
      plugin doctor:
        - name: --runtime
          type: enum
          enum: [auto, hermes, openclaw]
          required: false
          description: Runtime to diagnose. Defaults to auto, which diagnoses both runtimes. Use hermes or openclaw when the agent app says Regent tools are missing.
  - name: wallet
    interface: runtime
    auth_mode: none
    output_envelope: loose-object
    agent_metadata:
      category: wallet
      prompt_behavior: prompt_when_creating_wallet
      json_support: supported
      mutation_class: local-read-or-write
      retry_behavior: safe_for_status
      pagination: none
      async_behavior: synchronous
      input_mode: flags
      examples:
        - regents wallet status
        - regents wallet agentic status --json
        - regents wallet agentic fund --amount-usdc 10 --chain base
      commands:
        wallet status:
          next_step: regents wallet setup
        wallet setup:
          next_step: regents identity ensure
        wallet agentic status:
          next_step: regents wallet agentic balance --chain base --json
        wallet agentic login:
          next_step: regents wallet agentic verify --flow-id <flow-id> --otp <code> --json
        wallet agentic verify:
          next_step: regents wallet agentic balance --chain base --json
        wallet agentic balance:
          next_step: regents budget grant --agent <agent-id> --amount-usdc 10 --max-payment-usdc 0.25 --mode techtree_research --rail agentic-wallet --expires 7d
        wallet agentic fund:
          next_step: regents wallet agentic balance --chain base --json
    commands:
      - wallet status
      - wallet setup
      - wallet agentic status
      - wallet agentic login
      - wallet agentic verify
      - wallet agentic balance
      - wallet agentic fund
    flags:
      wallet agentic login:
        - name: --email
          type: string
          required: true
          description: Email address to start Agentic Wallet login.
        - name: --json
          type: boolean
          required: false
          description: Print the Agentic Wallet login response as JSON.
      wallet agentic verify:
        - name: --flow-id
          type: string
          required: true
          description: Agentic Wallet login flow id.
        - name: --otp
          type: string
          required: true
          description: One-time code from Agentic Wallet login.
        - name: --json
          type: boolean
          required: false
          description: Print the Agentic Wallet verification response as JSON.
      wallet agentic balance:
        - name: --chain
          type: enum
          enum: [base]
          required: true
          description: Chain to inspect for Agentic Wallet balance.
      wallet agentic fund:
        - name: --amount-usdc
          type: decimal-usd
          required: true
          description: Funding amount to show in the guided onramp instructions.
        - name: --chain
          type: enum
          enum: [base]
          required: true
          description: Chain to fund.
  - name: runtime-local
    interface: runtime
    auth_mode: none
    output_envelope: loose-object
    agent_metadata:
      category: local-control
      prompt_behavior: never_prompt
      json_support: required
      mutation_class: local-read
      retry_behavior: safe
      pagination: none
      async_behavior: synchronous
      input_mode: flags
      examples:
        - regents runtime status --json
        - regents runtime tools --json
        - regents runtime policy --json
      commands:
        runtime status:
          next_step: regents runtime tools --json
        runtime tools:
          next_step: regents runtime policy --json
        runtime policy:
          next_step: regents techtree work next --json
    commands:
      - runtime status
      - runtime tools
      - runtime policy
  - name: identity
    interface: runtime
    auth_mode: none
    output_envelope: loose-object
    agent_metadata:
      category: identity
      prompt_behavior: prompt_when_signing
      json_support: supported
      mutation_class: local-read-or-write
      retry_behavior: retry_after_user_action
      pagination: none
      async_behavior: synchronous
      input_mode: flags
      examples:
        - regents identity status
        - regents identity graph --json
    commands:
      - identity status
      - identity ensure
      - identity graph
    flags:
      graph:
        - name: --json
          type: boolean
          required: false
          description: Print the current identity graph as JSON for automation.
  - name: auth
    interface: http
    auth_mode: none
    output_envelope: loose-object
    agent_metadata:
      category: auth
      prompt_behavior: prompt_when_signing
      json_support: supported
      mutation_class: session-write
      retry_behavior: retry_after_user_action
      pagination: none
      async_behavior: synchronous
      input_mode: flags
      examples:
        - regents auth status
        - regents auth login --audience regent-services
    commands:
      - auth login
      - auth status
      - auth logout
    path_templates:
      - /v1/agent/siwa/nonce
      - /v1/agent/siwa/verify
  - name: mcp
    interface: runtime
    auth_mode: none
    output_envelope: loose-object
    agent_metadata:
      category: integration
      prompt_behavior: never_prompt
      json_support: supported
      mutation_class: local-read
      retry_behavior: safe
      pagination: none
      async_behavior: synchronous
      input_mode: args
      examples:
        - regents mcp export codex
        - regents mcp tools list --json
        - regents mcp doctor --json
        - regents mcp serve --transport stdio
    commands:
      - mcp export codex
      - mcp tools list
      - mcp doctor
      - mcp serve
    command_flags:
      mcp serve:
        - name: transport
          required: true
          description: MCP transport to start. Use stdio locally or streamable-http for a bearer-protected sidecar.
        - name: host
          required: false
          description: Host for streamable-http MCP.
        - name: port
          required: false
          description: Port for streamable-http MCP.
  - name: x402
    interface: runtime
    auth_mode: local-wallet
    output_envelope: loose-object
    agent_metadata:
      category: paid-api
      prompt_behavior: never_prompt
      json_support: supported
      mutation_class: payment-prepare-or-fetch
      retry_behavior: never_retry_payments
      pagination: none
      async_behavior: synchronous
      input_mode: flags
      examples:
        - regents x402 search "research data" --json
        - regents x402 details --url https://api.example.com/paid --json
        - regents x402 quote --url https://api.example.com/paid --json
        - regents x402 prepare --url https://api.example.com/paid --approve --json
        - regents x402 fetch --intent-id x402_intent_... --url https://api.example.com/paid --json
        - regents x402 refund --url https://api.example.com/paid --json
        - regents x402 pay https://api.example.com/paid --budget bud_... --max-usdc 0.25 --rail agentic-wallet --receipt --json
        - regents x402 receipts get --id x402_receipt_... --json
      commands:
        x402 search:
          next_step: regents x402 details --url <paid-url> --json
        x402 details:
          next_step: regents x402 quote --url <paid-url> --json
        x402 quote:
          next_step: regents x402 prepare --url <paid-url> --approve --json
        x402 prepare:
          next_step: regents x402 fetch --intent-id <intent-id> --url <paid-url> --json
        x402 pay:
          next_step: regents receipt share-draft --receipt <receipt-id>
        x402 receipts get:
          next_step: regents receipt create --from-x402-payment <payment-id> --json
    commands:
      - x402 search
      - x402 details
      - x402 quote
      - x402 prepare
      - x402 fetch
      - x402 refund
      - x402 pay
      - x402 receipts get
    flags:
      x402 pay:
        - name: --budget
          type: string
          required: true
          description: Regent budget that approves this payment.
        - name: --max-usdc
          type: decimal-usd
          required: true
          description: Maximum USDC to spend on this x402 request.
        - name: --max-deposit-amount
          type: string
          required: false
          description: Maximum atomic token amount the operator allows the CLI to escrow for batch-settlement payments.
        - name: --rail
          type: enum
          enum: [regent-wallet, agentic-wallet]
          required: true
          description: Payment rail to use for this request.
        - name: --approve
          type: boolean
          required: false
          description: Confirm a paid-service budget payment.
        - name: --receipt
          type: boolean
          required: false
          description: Create a local Regent receipt after a successful payment.
    command_flags:
      x402 details:
        - name: url
          required: true
          description: Protected resource URL to inspect.
        - name: method
          required: false
          description: HTTP method for the protected resource request.
        - name: body
          required: false
          description: Request body used while inspecting the protected resource.
        - name: header
          required: false
          description: Repeatable request header in Name/value form.
      x402 quote:
        - name: url
          required: true
          description: Protected resource URL to quote.
        - name: method
          required: false
          description: HTTP method for the protected resource request.
        - name: body
          required: false
          description: Request body used while quoting the protected resource.
        - name: header
          required: false
          description: Repeatable request header in Name/value form.
        - name: max-amount
          required: false
          description: Maximum accepted atomic token amount.
        - name: max-deposit-amount
          required: false
          description: Maximum atomic token amount the operator allows the CLI to escrow for batch-settlement payments.
      x402 prepare:
        - name: url
          required: true
          description: Protected resource URL to prepare.
        - name: method
          required: false
          description: HTTP method for the protected resource request.
        - name: body
          required: false
          description: Request body used while preparing the protected resource.
        - name: header
          required: false
          description: Repeatable request header in Name/value form.
        - name: max-amount
          required: false
          description: Maximum accepted atomic token amount.
        - name: max-deposit-amount
          required: false
          description: Maximum atomic token amount the operator allows the CLI to escrow for batch-settlement payments.
        - name: approve
          required: false
          description: Record explicit local operator approval for the prepared x402 request.
      x402 fetch:
        - name: intent-id
          required: true
          description: Approved x402 intent to use.
        - name: url
          required: true
          description: Protected resource URL to fetch.
        - name: method
          required: false
          description: HTTP method for the protected resource request.
        - name: body
          required: false
          description: Request body used while fetching the protected resource.
        - name: header
          required: false
          description: Repeatable request header in Name/value form.
      x402 refund:
        - name: url
          required: true
          description: Protected resource URL for the channel to refund.
        - name: header
          required: false
          description: Repeatable request header in Name/value form.
        - name: amount
          required: false
          description: Token base-unit amount to return. Omit to return the full unused channel balance.
      x402 receipts get:
        - name: id
          required: true
          description: x402 receipt id to read from the local Regent receipt store.
  - name: budget
    interface: runtime
    auth_mode: none
    output_envelope: loose-object
    agent_metadata:
      category: budget
      prompt_behavior: never_prompt
      json_support: supported
      mutation_class: local-policy-write
      retry_behavior: safe_for_reads
      pagination: bounded
      async_behavior: synchronous
      input_mode: flags
      examples:
        - regents budget grant --agent agent_123 --amount-usdc 10 --max-payment-usdc 0.25 --mode techtree_research --rail agentic-wallet --expires 7d
        - regents budget status --json
        - regents budget ledger --budget bud_...
      commands:
        budget grant:
          next_step: regents x402 search "research data" --json
        budget status:
          next_step: regents budget ledger --budget <budget-id>
        budget ledger:
          next_step: regents x402 pay <url> --budget <budget-id> --max-usdc 0.25 --rail agentic-wallet --receipt --json
        budget revoke:
          next_step: regents budget status --json
    commands:
      - budget grant
      - budget status
      - budget ledger
      - budget revoke
    flags:
      budget grant:
        - name: --agent
          type: string
          required: true
          description: Agent that may use this budget through Regent.
        - name: --amount-usdc
          type: decimal-usd
          required: true
          description: Total budget amount.
        - name: --max-payment-usdc
          type: decimal-usd
          required: true
          description: Maximum size for one payment.
        - name: --mode
          type: enum
          enum: [techtree_research, paid_service]
          required: true
          description: Work mode this budget is allowed to support.
        - name: --rail
          type: enum
          enum: [regent-wallet, agentic-wallet]
          required: true
          description: Payment rail this budget allows.
        - name: --allow-host
          type: string
          required: false
          description: Optional paid service hostname this budget may use. Repeat to allow more hosts.
        - name: --expires
          type: duration-or-time
          required: true
          description: Expiration such as 7d or an ISO timestamp.
      budget status:
        - name: --budget
          type: string
          required: false
          description: Budget id to inspect.
        - name: --agent
          type: string
          required: false
          description: Agent id to filter by.
      budget ledger:
        - name: --budget
          type: string
          required: true
          description: Budget id to inspect.
      budget revoke:
        - name: --budget
          type: string
          required: true
          description: Budget id to revoke.
  - name: receipt
    interface: runtime
    auth_mode: none
    output_envelope: loose-object
    agent_metadata:
      category: receipts
      prompt_behavior: never_prompt
      json_support: supported
      mutation_class: local-write
      retry_behavior: safe_for_reads
      pagination: bounded
      async_behavior: synchronous
      input_mode: flags
      examples:
        - regents receipt create --from-attempt attempt_... --json
        - regents receipt list --json
        - regents receipt share-draft --receipt rcpt_...
      commands:
        receipt create:
          next_step: regents receipt share-draft --receipt <receipt-id>
        receipt get:
          next_step: regents receipt share-draft --receipt <receipt-id>
        receipt list:
          next_step: regents receipt get --receipt <receipt-id>
        receipt share-draft:
          next_step: regents techtree fold report --agent <agent-id> --json
    commands:
      - receipt create
      - receipt get
      - receipt list
      - receipt share-draft
    flags:
      receipt create:
        - name: --from-attempt
          type: string
          required: false
          description: Techtree benchmark attempt id to cite.
        - name: --from-notebook
          type: string
          required: false
          description: Techtree notebook publication node id to cite.
        - name: --from-x402-payment
          type: string
          required: false
          description: x402 payment id to cite.
        - name: --from-budget-entry
          type: string
          required: false
          description: Local budget ledger entry to cite.
      receipt get:
        - name: --receipt
          type: string
          required: true
          description: Receipt id to inspect.
      receipt share-draft:
        - name: --receipt
          type: string
          required: true
          description: Receipt id to turn into draft share copy.
  - name: feynman
    interface: local-process
    auth_mode: none
    output_envelope: passthrough
    note: Launches the installed Feynman research shell from Regents CLI. Feynman keeps its own setup and sessions under its normal local folder.
    agent_metadata:
      category: local-tool
      prompt_behavior: may_prompt
      json_support: not_supported
      mutation_class: local-process
      retry_behavior: manual
      pagination: none
      async_behavior: interactive
      input_mode: interactive
      examples:
        - regents feynman
    commands:
      - feynman
  - name: doctor
    interface: runtime
    auth_mode: none
    output_envelope: loose-object
    agent_metadata:
      category: diagnostics
      prompt_behavior: never_prompt
      json_support: supported
      mutation_class: local-read
      retry_behavior: safe
      pagination: none
      async_behavior: synchronous
      input_mode: args
      examples:
        - regents doctor
        - regents doctor --fix
        - regents xmtp doctor
    commands:
      - doctor
      - doctor runtime
      - doctor auth
      - doctor techtree
      - doctor transports
      - doctor contracts
      - doctor workspace
    flags:
      doctor:
        - name: --fix
          type: boolean
          required: false
          description: Apply safe local repairs for blockers doctor can fix mechanically, such as creating the default config file, creating missing runtime folders, removing a validated stale runtime socket, and creating the default XMTP policy file. Everything else keeps its printed next step. No destructive repairs.
  - name: ens
    interface: http
    auth_mode: agent-siwa
    auth_audience: platform
    output_envelope: loose-object
    note: Ethereum mainnet only. The Regent ENS name must already be attached to the authenticated agent and already resolve to that wallet. This command prepares the reverse-name transaction by default and submits only with --submit.
    agent_metadata:
      category: identity
      prompt_behavior: confirm_before_submit
      json_support: supported
      mutation_class: transaction_prepare_or_submit
      retry_behavior: retry_prepare_only
      pagination: none
      async_behavior: synchronous
      input_mode: flags
      examples:
        - regents ens set-primary --name example.eth
    commands:
      - ens set-primary
    flags:
      set-primary:
        - name: --submit
          type: boolean
          required: false
          description: Submit the prepared transaction with the local wallet.
    path_templates:
      - /api/agent-platform/ens/prepare-primary
  - name: xmtp
    interface: runtime
    auth_mode: none
    output_envelope: loose-object
    agent_metadata:
      category: messaging
      prompt_behavior: prompt_for_local_identity_changes
      json_support: supported
      mutation_class: local-and-network-write
      retry_behavior: retry_idempotent_reads
      pagination: bounded
      async_behavior: synchronous
      input_mode: args-and-flags
      examples:
        - regents xmtp status
        - regents xmtp policy get
        - regents xmtp group list
    commands:
      - xmtp init
      - xmtp status
      - xmtp resolve
      - xmtp owner add
      - xmtp owner list
      - xmtp owner remove
