# The managed Techtree evaluation engine.
#
# Generated by regents-cli's scripts/techtree/build_engine_bundle.py. Do not edit by hand:
# the file is part of the engine bundle digest.

[project]
name = "techtree-engine-frontier-cs"
version = "0.1.0"
description = "Pinned Verifiers environment and the Frontier-CS Open-Ended taskset for Techtree."
requires-python = ">=3.12,<3.13"
dependencies = [
  "frontier-cs-open-ended-v1",
  "verifiers",
]

[tool.uv]
# The engine project is an environment, not a distribution. Nothing installs it.
package = false

[tool.uv.sources]
frontier-cs-open-ended-v1 = { path = "packages/frontier-cs-open-ended-v1", editable = true }
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers", rev = "fc73e02ea99594407bf7579c53f7711f7434635a" }
