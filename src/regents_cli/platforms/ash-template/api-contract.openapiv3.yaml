        in: header
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema:
                type: object
                required:
                - entries
                - pagination
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - kind
                      - at
                      - amount
                      - direction
                      - site
                      - purpose
                      - reason
                      - agent_address
                      - pairing_id
                      - key
                      - tool
                      - request
                      - note
                      - chain
                      - tx_hash
                      - refund_status
                      - refund_sent_at
                      properties:
                        id:
                          type: string
                        kind:
                          type: string
                          enum:
                          - bought
                          - gift
                          - refund
                          - set_aside
                          - returned
                          - spent
                          - received
                        at:
                          type: string
                          format: date-time
                        amount:
                          type: string
                          description: Positive decimal Credits amount, summed for this event.
                        direction:
                          type: string
                          enum:
                          - in
                          - out
                          - none
                        site:
                          type:
                          - string
                          - 'null'
                        purpose:
                          type:
                          - string
                          - 'null'
                        reason:
                          type:
                          - string
                          - 'null'
                        agent_address:
                          type:
                          - string
                          - 'null'
                        pairing_id:
                          type:
                          - string
                          - 'null'
                        key:
                          type:
                          - string
                          - 'null'
                        tool:
                          type:
                          - string
                          - 'null'
                        request:
                          type:
                          - string
                          - 'null'
                          description: Present only when allowed for this reader; an agent receives request text only for its own hold.
                        note:
                          type:
                          - string
                          - 'null'
                        chain:
                          type:
                          - string
                          - 'null'
                        tx_hash:
                          type:
                          - string
                          - 'null'
                        refund_status:
                          type:
                          - string
                          - 'null'
                          enum:
                          - locked
                          - sent
                          - null
                        refund_sent_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                      description: Grouped history event. Inapplicable facts are null; received payments do not identify the payer.
                  pagination:
                    type: object
                    required:
                    - has_more
                    - next_cursor
                    properties:
                      has_more:
                        type: boolean
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: Pass unchanged as after for the next page. Null when no further page exists.
        '403':
          $ref: '#/components/responses/AgentNotActingForPerson'
        '401':
          description: Request refused; JSON error contains code, message and hint.
        '429':
          description: Request refused; JSON error contains code, message and hint.
        '409':
          description: Request refused; JSON error contains code, message and hint.
        '503':
          description: Request refused; JSON error contains code, message and hint.
        default:
          description: Request refused; JSON error contains code, message and hint.
        '422':
          description: Invalid after cursor (invalid_cursor). Use the previous pagination.next_cursor unchanged, or omit after for the newest entries; do not send null.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - hint
                    properties:
                      code:
                        type: string
                        const: invalid_cursor
                      message:
                        type: string
                      hint:
                        type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                after:
                  type: string
                  maxLength: 2048
                  description: Previous pagination.next_cursor unchanged, at most 2048 characters. Omit for the newest entries; do not send null.
              required: []
              additionalProperties: false
