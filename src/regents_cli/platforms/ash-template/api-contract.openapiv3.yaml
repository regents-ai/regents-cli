      properties:
        id: {type: string, format: uuid}
        room: {type: string}
        author_name: {type: string}
        author_kind: {type: string, enum: [person, agent]}
        author_human_backed: {type: boolean}
        via_agent:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/AgentRef"}
        body: {type: string, maxLength: 2000}
        inserted_at: {type: string, format: date-time}
        edited_at: {type: [string, "null"], format: date-time}
    RoomMessageEnvelope:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: {$ref: "#/components/schemas/RoomMessage"}
    RoomMessageCreateInput: {"type": "object", "additionalProperties": false, "required": ["body", "operation_id"], "properties": {"body": {"type": "string", "minLength": 1, "maxLength": 2000, "description": "The message."}, "operation_id": {"type": "string", "format": "uuid", "description": "Stable UUID for this logical message; retain it when retrying with fresh proof."}}}
    RoomMessageInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 2000}
    RoomMessagesPage:
      type: object
