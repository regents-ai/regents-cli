            code:
              type: string
              enum: [authentication_required, account_required, agent_not_paired, person_not_here, note_not_found, invalid_note, notes_unavailable]
            message: {type: string}
            hint: {type: string}
    Session:
      type: object
      additionalProperties: false
      required: [authenticated, account_control]
      properties:
        authenticated: {type: boolean}
        account_control:
          type: object
          additionalProperties: false
          required: [kind, label, avatar_src]
          properties:
            kind: {type: string, enum: [sign_in, signed_in]}
            label: {type: string}
            avatar_src:
              type: [string, "null"]
              pattern: "^data:image/svg\\+xml;base64,"
    RecoveryError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string}
            message: {type: string}
            hint: {type: string}
    Health:
