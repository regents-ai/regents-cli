                $ref: '#/components/schemas/Error'
        '401':
          description: Signed request refused; error contains code, message and hint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Signed request refused; error contains code, message and hint.
          content:
            application/json:
