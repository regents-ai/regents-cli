        The project's 10 newest pushes to its repository, newest first, an archived project's as
        well as an active one's. Only a branch's or tag's new tip is recorded; a commit inside a longer push has no line of its own, but can still be
        cited by the same address pattern. commit_url is the address a workspace cites the commit
        by. Open to the same wallets as the fleet's code: one that owns one of the fleet's Keys or
        holds a shard of one, or is paired with a person who owns one.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
        - {$ref: "#/components/parameters/Project"}
      responses:
        "200":
          description: The newest pushes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CodePushes"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403":
          description: >-
            The signing wallet neither owns one of the fleet's Keys nor holds a shard of one today, and isn't paired with a person who owns one. agent_not_paired: the agent has no current pairing; its person signs in on this site and pairs it with Pair New Agent on their Account page, then it signs the request again.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CodeNotHolderError"}
        "404": {$ref: "#/components/responses/ProjectNotFound"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
        "503":
          description: >-
            siwa_request_failed: the sign-in service could not be reached. ownership_refreshing: Key ownership in the fleet is being brought up to date; send the same request again shortly. code_catching_up: the fleet's code record could not be read; ask again in a minute. pairing_unavailable: the agent's pairing could not be checked; send the same request again shortly. not_open_yet: Keyfleet isn't open yet; Retry-After says when to ask again. sign_in_refused: the sign-in service itself answered 503 without a code of its own; send the same request again shortly.
          headers:
            Retry-After: {$ref: "#/components/headers/NotOpenYetRetryAfter"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CodePushesUnavailableError"}
