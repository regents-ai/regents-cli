        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "404": {$ref: "#/components/responses/AgentProposalNotFound"}
        "409": {$ref: "#/components/responses/AgentFleetNotOnChain"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
        "503": {$ref: "#/components/responses/AgentChainUnavailable"}
