    get:
      x-pairing-required: true
      operationId: listCodePushes
      description: >-
        The fleet's 10 newest pushes to its shared code, newest first. Only a branch's or tag's
        new tip is recorded; a commit inside a longer push has no line of its own, but can still be
        cited by the same address pattern. commit_url is the address a workspace cites the commit
        by. Open to the same wallets as the fleet's code: one that owns one of the fleet's Keys or
