  /api/v1/agent/fleets/{fleet_id}/checkpoint/save:
    post:
      x-pairing-required: true
      operationId: saveCheckpoint
      description: >-
        Saves the signing agent's whole checkpoint in one fleet from the revision it read, 0 for
        its first save, as the next revision. A save from any other revision changes nothing and
        answers 409 checkpoint_conflict with the checkpoint as it is now, so two runs of one agent
        never overwrite each other unseen. Only the agent's own wallet reads or saves it. The body
        is at most 16640 bytes.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckpointSaveRequest"}
      responses:
        "200":
          description: The checkpoint at its next revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckpointAnswer"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403": {$ref: "#/components/responses/AgentNotPaired"}
        "404": {$ref: "#/components/responses/AgentFleetNotFound"}
        "409":
          description: >-
            checkpoint_conflict: the checkpoint is no longer at the revision sent, because another
            run of the agent saved first. Nothing was saved; error.details.checkpoint is the
            checkpoint as it is now, or null for none.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckpointConflictError"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
        "503": {$ref: "#/components/responses/CheckpointUnavailable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/SignInRefusal"}
