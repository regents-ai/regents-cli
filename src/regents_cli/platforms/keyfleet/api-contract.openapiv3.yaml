        "200": {$ref: "#/components/responses/WorkspaceWritten"}
        "400": {$ref: "#/components/responses/WorkspaceRefused"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403": {$ref: "#/components/responses/WorkspaceRefused"}
        "404": {$ref: "#/components/responses/WorkspaceNotFound"}
        "409": {$ref: "#/components/responses/WorkspaceConflict"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/WorkspaceInvalid"}
        "503": {$ref: "#/components/responses/WorkspaceWriteUnavailable"}
