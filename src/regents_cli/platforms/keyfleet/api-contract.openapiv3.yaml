      description: >-
        The transaction that carries out an approved proposal, with the calls it was made with.
        Anyone may carry one out. A proposal that moves money waits a day after its vote closes,
        then has 48 hours; any other has 48 hours from when its vote closes. Nothing is sent here:
        the signing wallet sends it itself, on Base.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProposalNumberRequest"}
      responses:
        "403":
          description: Current pairing is required; fresh proof after pairing or revocation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "200":
          description: The transaction and where the proposal stands
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChainProposalStatus"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "404": {$ref: "#/components/responses/AgentProposalNotFound"}
        "409": {$ref: "#/components/responses/AgentFleetNotOnChain"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
        "503": {$ref: "#/components/responses/AgentChainUnavailable"}
