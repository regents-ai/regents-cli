      operationId: buildCarryOut
      description: >-
        The transaction that carries out an approved proposal, with the calls it was made with.
        Anyone may carry one out. A proposal that moves money waits a day after its vote closes,
        then has 48 hours; any other has 48 hours from when its vote closes. Nothing is sent here:
        the signing wallet sends it itself, on Base.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody:
        required: true
