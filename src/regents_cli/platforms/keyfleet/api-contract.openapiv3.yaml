  /api/v1/agent/fleets/{fleet_id}/graph/get:
    post:
      x-pairing-required: true
      operationId: getWorkspaceObject
      description: >-
        One object in a fleet's workspace, with its first 200 links, as of watermark. Only a wallet
        that owns one of the fleet's Keys today, or holds an active shard of one, may read.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceGetRequest"}
      responses:
        "200":
          description: The object and its links
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceObjectView"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403": {$ref: "#/components/responses/WorkspaceReadRefused"}
        "404": {$ref: "#/components/responses/WorkspaceNotFound"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
        "503": {$ref: "#/components/responses/WorkspaceReadUnavailable"}
