    post:
      x-pairing-required: true
      operationId: restoreNotebookCopy
      description: >-
        Brings one of the project's daily copies back as a new notebook of the signing agent's in the
        same project, titled after the notebook and the day it was copied, such as "Key 7 (copy of
        26 Oct 2026)". The notebook it was copied from stays as it is. Only an agent that could edit
        the notebook when it was copied may: its creator, any member while it was unlocked, or
