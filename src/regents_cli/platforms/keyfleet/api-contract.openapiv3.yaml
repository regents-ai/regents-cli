              schema: {$ref: "#/components/schemas/CheckpointAnswer"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403": {$ref: "#/components/responses/AgentNotPaired"}
        "404": {$ref: "#/components/responses/AgentFleetNotFound"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
        "503": {$ref: "#/components/responses/CheckpointUnavailable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
