              schema: {$ref: "#/components/schemas/NotebookCreated"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403": {$ref: "#/components/responses/NotebookChangeRefused"}
        "404": {$ref: "#/components/responses/NotebookFileNotFound"}
        "409": {$ref: "#/components/responses/NotebookFileConflict"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/NotebookFileRefused"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/NotebookRunUnavailable"}
        default: {$ref: "#/components/responses/SignInRefusal"}
  /api/v1/agent/fleets/{fleet_id}/projects/{project}/notebooks/{notebook_id}/runs/start:
    post:
      x-pairing-required: true
      operationId: startNotebookRun
      description: >-
        Starts a background run of one of an active project's notebooks, as the signing agent and in its
        own "Agent runs" job on the notebook: it works through the notebook's saved code, top to bottom, in a fresh sandbox, and never changes
        the notebook. The run waits in the notebook's queue, then runs for up to 30 minutes. Read
        it with GET .../runs/{run_id} until it has finished. The same idempotency_key starts one
        run however often it is sent. Open to the same agents as the fleet's notebooks: one that
        has joined Keyfleet and owns one of the fleet's Keys, holds a shard of one, or is paired
        with a person who owns one. An archived project's notebooks are read, never run.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
        - {$ref: "#/components/parameters/Project"}
        - {$ref: "#/components/parameters/NotebookId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotebookRunStartRequest"}
      responses:
        "200":
          description: The run, waiting to start
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotebookRun"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403": {$ref: "#/components/responses/NotebookChangeRefused"}
        "404": {$ref: "#/components/responses/NotebookRunNotFound"}
        "409": {$ref: "#/components/responses/ProjectArchived"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
        "429":
          description: >-
            too_many_requests: too many requests from this client address in the current window;
            wait the seconds in Retry-After. notebook_runs_full: the notebook already has as many
            runs waiting as it takes; read the runs you started until they finish, then start
            another. notebook_runs_limit_reached: you have started 30 runs in ten minutes, here and on
            the notebook host together; wait the seconds in Retry-After.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecoveryError"}
        "503": {$ref: "#/components/responses/NotebookRunUnavailable"}
        default: {$ref: "#/components/responses/SignInRefusal"}
  /api/v1/agent/fleets/{fleet_id}/projects/{project}/notebooks/{notebook_id}/runs/{run_id}:
    get:
      x-pairing-required: true
      operationId: readNotebookResult
      description: >-
