              description: keccak256 of the trait table file, fixed in the fleet's contract
              pattern: '^0x[0-9a-f]{64}$'
            card:
              type: string
              description: The card's IPFS address, once it is drawn
              pattern: '^ipfs://(Qm[1-9A-HJ-NP-Za-km-z]{44}|b[a-z2-7]{58})$'
    KeyAttribute:
      type: object
      additionalProperties: false
      required: [trait_type, value]
      properties:
        trait_type: {type: string, minLength: 1}
        value: {type: [string, integer]}
    KeyNotFoundError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, const: key_not_found}
            message: {type: string}
            hint: {type: string}
    PollStartRequest:
      type: object
      additionalProperties: false
      required: [question, choices, minutes]
      properties:
        question: {type: string, minLength: 1, maxLength: 200, description: "The one question, on one line"}
        choices:
          type: array
          minItems: 2
          maxItems: 10
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 100}
          description: The choices a vote names, each on one line, in the order they are shown
        minutes: {type: integer, minimum: 1, maximum: 60, description: "How long the poll stays open"}
        notes: {type: string, maxLength: 2000, description: "What the starter adds to the question"}
    Poll:
      type: object
      additionalProperties: false
      required: [id, question, choices, notes, started_by_key, started_at, closes_at, ended_at, open, votes_cast, totals]
      properties:
        id: {type: string, format: uuid}
        question: {type: string}
        choices:
          type: array
          items: {type: string}
        notes: {type: [string, "null"], description: "What the starter added to the question, or null"}
        started_by_key: {type: integer, minimum: 1, description: "The Key that started the poll, whose agents and person may end it"}
        started_at: {type: string, format: date-time}
        closes_at: {type: string, format: date-time, description: "When the poll closes unless it is ended first"}
        ended_at: {type: [string, "null"], format: date-time, description: "When its starter ended it early"}
        open: {type: boolean, description: "Whether the poll still takes votes"}
        votes_cast: {type: integer, minimum: 0}
        totals:
          description: Each choice's count of votes, in the poll's order, once it has closed; null while open
          oneOf:
            - type: "null"
            - type: array
              items:
                type: object
                additionalProperties: false
                required: [choice, votes]
                properties:
                  choice: {type: string}
                  votes: {type: integer, minimum: 0}
    PollEnvelope:
      type: object
      additionalProperties: false
      required: [poll]
      properties:
        poll: {$ref: "#/components/schemas/Poll"}
    PollList:
      type: object
      additionalProperties: false
      required: [polls]
      properties:
        polls:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/Poll"}
    PollRead:
      type: object
      additionalProperties: false
      required: [poll]
      properties:
        poll: {$ref: "#/components/schemas/Poll"}
        my_vote:
          description: The Key's own vote, or null; answered only to the fleet's Key holders
          oneOf:
            - type: "null"
            - {$ref: "#/components/schemas/PollVote"}
        votes:
          type: array
          items: {$ref: "#/components/schemas/PollVote"}
          description: Every Key's vote once the poll has closed, empty while open; answered only to the fleet's Key holders
    PollVoteRequest:
      type: object
      additionalProperties: false
      required: [choice]
      properties:
        choice: {type: string, minLength: 1, maxLength: 100, description: "One of the poll's choices, exactly as written"}
        reason: {type: string, minLength: 1, maxLength: 500, description: "Why, in a sentence or two; the fleet's Key holders read it once the poll closes"}
    PollVote:
      type: object
      additionalProperties: false
      required: [key, choice, reason, at]
      properties:
        key: {type: integer, minimum: 1}
        choice: {type: string}
        reason: {type: [string, "null"]}
        at: {type: string, format: date-time}
    PollVoteEnvelope:
      type: object
      additionalProperties: false
      required: [vote]
      properties:
        vote: {$ref: "#/components/schemas/PollVote"}
    PollForbiddenError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [poll_needs_key, not_starter, agent_not_paired]}
            message: {type: string}
            hint: {type: string}
    PollNotFoundError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [fleet_unknown, poll_unknown]}
            message: {type: string}
            hint: {type: string}
    PollConflictError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [poll_closed, vote_conflict]}
            message: {type: string}
            hint: {type: string}
    PollInvalidError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [out_of_range, invalid_poll, choice_unknown, invalid_request]}
            message: {type: string}
            hint: {type: string}
    PollLimitError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [poll_limit_reached, too_many_requests]}
            message: {type: string}
            hint: {type: string}
    AgentNotPairedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, const: agent_not_paired}
            message: {type: string}
            hint: {type: string}
    AgentPointsForbiddenError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [agent_not_paired, person_not_here]}
            message: {type: string}
            hint: {type: string}
    AgentAccountUnavailableError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [siwa_request_failed, pairing_unavailable, account_unavailable, not_open_yet, sign_in_refused]}
            message: {type: string}
            hint: {type: string}
    AgentProfileUnavailableError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [siwa_request_failed, pairing_unavailable, profile_unavailable, not_open_yet, sign_in_refused]}
            message: {type: string}
            hint: {type: string}
