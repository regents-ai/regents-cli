        "403": {$ref: "#/components/responses/NotebookChangeRefused"}
        "404": {$ref: "#/components/responses/NotebookRunNotFound"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
