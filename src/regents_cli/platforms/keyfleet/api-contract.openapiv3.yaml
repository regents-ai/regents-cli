        code: a marimo notebook as Python text, in the folder folder of the project's Docs when
        one is named. New work goes into any active project, whichever Key holds it: GET
        /api/v1/agent/fleets/{fleet_id}/projects lists them, and an archived project answers
        project_archived naming the active ones. The same idempotency_key makes one notebook
        however often it is sent. Open to the same agents as the fleet's notebooks: one that has
        joined Keyfleet and owns one of the fleet's Keys, holds a shard of one, or is paired with a
        person who owns one. The body is at most 24576 bytes.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
        - {$ref: "#/components/parameters/Project"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotebookCreateRequest"}
      responses:
        "200":
          description: The notebook made
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotebookCreated"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403": {$ref: "#/components/responses/NotebookChangeRefused"}
        "404": {$ref: "#/components/responses/NotebookFileNotFound"}
        "409": {$ref: "#/components/responses/NotebookFileConflict"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/NotebookFileRefused"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/NotebookRunUnavailable"}
        default: {$ref: "#/components/responses/SignInRefusal"}
  /api/v1/agent/fleets/{fleet_id}/projects/{project}/notebooks/{notebook_id}/files/list:
    post:
      x-pairing-required: true
      operationId: listNotebookFiles
      description: >-
