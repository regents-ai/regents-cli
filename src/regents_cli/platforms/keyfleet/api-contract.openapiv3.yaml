    post:
      x-pairing-required: true
      operationId: buildClaim
      description: >-
        The transactions that claim what a Key has earned, one for each asset it is paid in. The
        money goes to the Key's holder, whoever sends them. The signing wallet may claim for a Key
        it holds or holds an active shard of. Nothing is sent here: the signing wallet sends them
        itself, on Base.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
        - {$ref: "#/components/parameters/TokenId"}
      requestBody: {$ref: "#/components/requestBodies/AgentEmpty"}
      responses:
        "403": {$ref: "#/components/responses/AgentNotPaired"}
        "200":
          description: The transactions and what is waiting for the Key in each asset
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChainClaim"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "404": {$ref: "#/components/responses/KeyNotFound"}
        "409": {$ref: "#/components/responses/AgentFleetNotOnChain"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
        "503": {$ref: "#/components/responses/AgentChainUnavailable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/SignInRefusal"}
  /api/v1/agent/fleets/{fleet_id}/keys/claim:
    post:
      x-pairing-required: true
      operationId: buildClaimAll
      description: >-
        The transactions that claim, at once, what every Key the signing wallet holds or holds an
        active shard of in the fleet has earned, one for each asset they are paid in. Each Key's
        money goes to its holder, whoever sends them. Nothing is sent here: the signing wallet sends
        them itself, on Base.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody: {$ref: "#/components/requestBodies/AgentEmpty"}
      responses:
        "403": {$ref: "#/components/responses/AgentNotPaired"}
        "200":
          description: The transactions, the Keys they claim for and what is waiting in each asset
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChainClaimAll"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "404": {$ref: "#/components/responses/AgentFleetNotFound"}
        "409": {$ref: "#/components/responses/AgentFleetNotOnChain"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
        "503": {$ref: "#/components/responses/AgentChainUnavailable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/SignInRefusal"}
  /api/v1/agent/fleets/{fleet_id}/keys/buy:
    post:
      x-pairing-required: true
      operationId: buildBuy
      description: >-
        The transactions that buy the fleet's next Key for the signing wallet, at its price read
        from the chain at the latest block: approving USDC to the fleet's manager when the wallet's
        allowance is below the most the purchase may cost, then the purchase. If another buyer
        gets that Key first, the purchase gets the next one left for up to max_price, or is refused
        and takes no USDC. It stays good for ten minutes. The approval is exactly max_price.
        Nothing is sent here: the signing wallet sends them itself, on Base, and becomes the Key's
        holder.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody: {$ref: "#/components/requestBodies/AgentEmpty"}
