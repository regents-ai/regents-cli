      description: >-
        The transaction that cancels a proposal while it is open or approved. Whoever may vote the
        Key it was made with may cancel it. Nothing is sent here: the signing wallet sends it
        itself, on Base.
      security: [{siwaReceipt: []}]
      parameters:
