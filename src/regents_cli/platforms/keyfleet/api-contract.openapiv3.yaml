  /api/v1/agent/fleets/{fleet_id}/split:
    post:
      x-pairing-required: true
      operationId: buildSplit
      description: >-
        The transaction that runs the fleet's daily split, with its preview: for each asset the
        treasury splits, the balance, the least it splits from, and what each Key would get now.
        Anyone may run it once 24 hours have passed since the last run. Nothing is sent here: the
        signing wallet sends it itself, on Base.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody: {$ref: "#/components/requestBodies/AgentEmpty"}
      responses:
        "403":
          description: Current pairing is required; fresh proof after pairing or revocation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "200":
          description: The transaction and the split's preview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChainSplit"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "404": {$ref: "#/components/responses/AgentFleetNotFound"}
        "409": {$ref: "#/components/responses/AgentFleetNotOnChain"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
