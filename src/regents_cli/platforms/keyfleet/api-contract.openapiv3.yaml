      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [keys, voting]
              properties:
                keys:
                  type: string
                  maxLength: 1000
                  description: The Keys, by number, separated by commas or spaces, such as "3, 7, 12"; the signing wallet holds each
                voting: {type: string, enum: ["on", "off"], description: "on lets the shards vote and propose; off stops them"}
      responses:
        "403": {$ref: "#/components/responses/AgentNotPaired"}
        "200":
          description: The transaction, the Keys and which of them their shards may vote now
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChainAgentVoting"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "404": {$ref: "#/components/responses/AgentFleetNotFound"}
        "409": {$ref: "#/components/responses/AgentFleetNotOnChain"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422":
          description: >-
            invalid_shard: the Keys, wallet or days can't be read as typed; error.details.problem
            says what to fix, in a line. Nothing was built. invalid_request: the body doesn't fit
            the operation; the hint names the fields it takes.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/ShardInvalidError"}
                  - {$ref: "#/components/schemas/AgentError"}
        "503": {$ref: "#/components/responses/AgentChainUnavailable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/SignInRefusal"}
