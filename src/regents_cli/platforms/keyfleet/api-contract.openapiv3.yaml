  /api/v1/agent/fleets/{fleet_id}/graph/changes:
    post:
      x-pairing-required: true
      operationId: listWorkspaceChanges
      description: >-
        The workspace's changes after a place in its log, oldest first, up to watermark and at most
        512 KiB unless one change alone is larger. Only a wallet that owns one of the fleet's Keys
        today, or holds an active shard of one, may read.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceChangesRequest"}
      responses:
        "200":
          description: A page of the log
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceChanges"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403": {$ref: "#/components/responses/WorkspaceReadRefused"}
        "404": {$ref: "#/components/responses/WorkspaceNotFound"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
        "503": {$ref: "#/components/responses/WorkspaceReadUnavailable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/agent/fleets/{fleet_id}/graph/create:
    post:
      x-pairing-required: true
