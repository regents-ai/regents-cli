                keys:
                  type: string
                  maxLength: 1000
                  description: The Keys, by number, separated by commas or spaces, such as "3, 7, 12"; the signing wallet holds each
                wallet: {type: string, maxLength: 100, description: "The agent's wallet: 0x and 40 letters and numbers"}
                days: {type: string, maxLength: 10, description: "How long the shard lasts, 1 to 365 days, such as \"30\""}
      responses:
        "403": {$ref: "#/components/responses/AgentNotPaired"}
        "200":
          description: The transaction, the Keys, the wallet and the days
