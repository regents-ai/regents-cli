  /api/v1/agent/fleets/{fleet_id}/treasury/send_share:
    post:
      x-pairing-required: true
      operationId: buildSendShare
      description: >-
        The transaction that sends the share the fleet owes REGENT staking from its Key sales, with
        what is owed now. Anyone may send it; it moves no one's own money. Blocked "Nothing owed"
        when nothing is owed. Nothing is sent here: the signing wallet sends it itself, on Base.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody: {$ref: "#/components/requestBodies/AgentEmpty"}
      responses:
        "403": {$ref: "#/components/responses/AgentNotPaired"}
        "200":
          description: The transaction and what is owed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChainSendShare"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "404": {$ref: "#/components/responses/AgentFleetNotFound"}
        "409": {$ref: "#/components/responses/AgentFleetNotOnChain"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
        "503": {$ref: "#/components/responses/AgentChainUnavailable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/SignInRefusal"}
  /api/v1/agent/fleets/{fleet_id}/treasury/convert:
    post:
      x-pairing-required: true
      operationId: buildConvert
      description: >-
        The transaction that turns USDC waiting from Key sales into REGENT for its fleet's
        treasury: at most the amount named, and at most 250 USDC a press whatever is named. The
        REGENT buyer serves every fleet in turn, so the USDC may be another fleet's. Anyone may
        send it. Blocked "Nothing waiting to turn into REGENT" when no fleet is in line, "Opens
        <time>" before the next piece may run, or "Too big now: try <amount> USDC",
        the most whole USDC that goes through now, when the amount named would move the price more
        than 1% ("Can’t buy REGENT right now" when none does). Nothing is sent here: the signing wallet sends it
        itself, on Base. The body is at most 4096 bytes.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inputs]
              properties:
                inputs:
                  type: object
                  additionalProperties: false
                  required: [amount]
                  properties:
                    amount:
                      type: string
                      maxLength: 100
                      description: >-
                        USDC to turn, as a decimal string such as "250" or "12.5", at most 6
                        decimal places. At most 250 is turned a press, so "250" is the usual
                        choice.
      responses:
        "403": {$ref: "#/components/responses/AgentNotPaired"}
        "200":
          description: The transaction, the amount it turns, what this fleet has waiting and when the next piece may run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChainConvert"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "404": {$ref: "#/components/responses/AgentFleetNotFound"}
        "409": {$ref: "#/components/responses/AgentFleetNotOnChain"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422":
          description: >-
            invalid_amount: the amount can't be read as USDC; error.details.problem says how to
            write it, in a line. Nothing was built. invalid_request: the body doesn't fit the
            operation; the hint names the fields it takes.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/AmountInvalidError"}
                  - {$ref: "#/components/schemas/AgentError"}
        "503": {$ref: "#/components/responses/AgentChainUnavailable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/SignInRefusal"}
