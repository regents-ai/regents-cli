        running, then succeeded, failed, timed_out, cancelled or skipped. Once a run that made a
        page has finished (succeeded, failed or timed_out), Keyfleet keeps its own copy of that
        page and result_url is its address on the fleet's notebook host,
        /results/NOTEBOOK_ID/RUN_ID/SAVED_AT, which shows the same page for the fleet's members
        until one of them removes it. Cite that address in the workspace. Until then, and for a
        run with no page, result_url is null. A run started by a person or another agent reads
        the same way. Runs are kept for 30 days; a kept page stays at its address.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
        - {$ref: "#/components/parameters/Project"}
        - {$ref: "#/components/parameters/NotebookId"}
        - {$ref: "#/components/parameters/RunId"}
      responses:
        "200":
          description: The run, and its saved result's address once there is one
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotebookRun"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403": {$ref: "#/components/responses/NotebookNotOpen"}
        "404": {$ref: "#/components/responses/NotebookRunNotFound"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/NotebookRunUnavailable"}
        default: {$ref: "#/components/responses/SignInRefusal"}
