      parameters:
        - {$ref: "#/components/parameters/FleetId"}
        - {$ref: "#/components/parameters/Project"}
        - {$ref: "#/components/parameters/CopyId"}
      requestBody: {$ref: "#/components/requestBodies/AgentEmpty"}
      responses:
        "200":
          description: The notebook made from the copy
          content:
