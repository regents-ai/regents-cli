# Written by uv run scripts/features.py --write from the pinned copies and the
# features listed in that script; make check fails when this file is out of date.
repo: regents-cli
features:
- id: signed-requests
  what: 'An agent runs any site''s command: regents builds the request from the site''s pinned description,
    signs it with the agent key, sends it once, and returns the answer or the refusal with what to do
    next.'
  who: agent
  level: protected
  paths:
  - src/regents_cli/__init__.py
  - src/regents_cli/__main__.py
  - src/regents_cli/app.py
  - src/regents_cli/base.py
  - src/regents_cli/errors.py
  - src/regents_cli/http.py
  - src/regents_cli/next_steps.py
  - src/regents_cli/output.py
  - src/regents_cli/runner.py
  - src/regents_cli/siwa.py
  - src/regents_cli/platforms/__init__.py
  - src/regents_cli/schemas/**
  entry:
  - cli: regents <site> <command>
  - cli: regents <site> <command> --phase prepare, then --phase send
  proofs:
  - tests/test_properties.py
  - tests/test_replays.py
  - tests/test_next_steps.py
  - tests/test_prepared.py
  - tests/test_contract.py
  regressions:
  - id: R-20261018-refusal-fields
    from: '1.10.15 candidate: a site error field named exit_code crashed regents'
    test: tests/test_properties.py
  - id: R-20261018-deep-bodies
    from: 'review of 6570fcd: an answer nested too deep, or holding NaN'
    test: tests/test_properties.py
  - id: R-20261018-dash-values
    from: 'review of 6098f3b: a printed command misread values starting with -'
    test: tests/test_properties.py
  - id: R-20261019-node-words
    from: '1.10.15 hold: a Base node''s own refusal reached the screen, and a short wallet was not told
      how much it needed'
    test: tests/test_register.py
  - id: R-20261020-pairing-page
    from: '16 Oct review: an unpaired agent on any site was sent to regents.sh to pair, though the person
      makes the code signed in on the site the agent called'
    test: tests/test_next_steps.py
  gaps:
  - Signed commands are proven against local stand-ins only; nothing is signed against the live sites.
- id: site-doctor
  what: 'An agent checks a site: it answers, its public reads answer, and this machine''s sign-in is good,
    or not made yet; a site that fails is searched for on patchbay.help, then reported there.'
  who: agent
  level: ordinary
  paths:
  - src/regents_cli/doctor.py
  entry:
  - cli: regents <site> doctor
  proofs: []
  regressions: []
  gaps:
  - 'No test yet (tests wait until a release has worked live for an hour): a failing site is searched
    for before it is reported; checks against another address are not posted against the site; no sign-in
    yet exits 0; an expired sign-in exits 1.'
  - The sign-in check is not run against the live sign-in server.
- id: sign-in
  what: An agent signs in to a site with its key, or a person with their own wallet, and the site's receipt
    is kept for that site.
  who: agent
  level: protected
  paths:
  - src/regents_cli/auth.py
  entry:
  - cli: regents auth login
  - cli: regents auth register
  - cli: regents auth status
  - cli: regents auth logout
  - cli: regents auth accept-world-id
  proofs:
  - tests/test_sign_in.py
  - tests/test_register.py
  - tests/test_contract.py
  regressions:
  - id: R-20261019-register-signs-server-step
    from: '1.10.15 hold: auth register signed the step the sign-in server sent without building it, and
      showed nothing before signing'
    test: tests/test_register.py
  - id: R-20261019-register-answer
    from: '1.10.15 hold: a registration answer missing a listing field crashed auth register'
    test: tests/test_register.py
  - id: R-20261019-register-keeps-hash
    from: 'review of 026fda3: a sign-in server error after sending lost the transaction hash, inviting
      a second registration'
    test: tests/test_register.py
  - id: R-20261019-register-signed-bytes
    from: 'review of 026fda3: the cost left out Base''s fee for writing to Ethereum, node numbers were
      read loosely, and the helper''s signed bytes went unchecked'
    test: tests/test_register.py
  - id: R-20261019-register-signing-hash
    from: 'Sentinel read of 37063e8: the signed-bytes check compared only the shown fields, so an access
      list or an EIP-7702 delegation signed by the helper went out; review of 9ff97a5: other signature
      forms and spellings of the bytes passed'
    test: tests/test_register.py
  gaps:
  - auth accept-world-id is not run whole offline.
  - auth register is proven against a stand-in Base node; nothing is sent on Base.
- id: touch-id-key
  what: On a Mac, a person locks the agent key with Touch ID; a helper keeps it unlocked until the Mac
    restarts and signs for the agent.
  who: person
  level: protected
  paths:
  - src/regents_cli/passkey.py
  - src/regents_cli/passkey.html
  - src/regents_cli/browser.py
  entry:
  - cli: regents auth login, the first time on a Mac
  proofs:
  - tests/test_passkey.py
  - tests/test_touch_id_page.py
  regressions:
  - id: R-20261008-stuck-helper
    from: 'WD-002: a key helper that never answered hung every signed command'
    test: tests/test_passkey.py
  gaps:
  - 'The page is run in headless Chromium with a virtual Touch ID, not Safari, and on a Mac only: the
    publish workflow''s Linux run skips it, and make release-check runs it. scripts/check_live.py checks
    it is the live sign-in server''s page.'
- id: techtree-model-sign-in
  what: A person signs this machine in to their ChatGPT plan, so Climbs can run on it.
  who: person
  level: protected
  paths:
  - src/regents_cli/techtree/chatgpt/**
  - src/regents_cli/techtree/commands/model.py
  entry:
  - cli: regents techtree model login
  - cli: regents techtree model status
  - cli: regents techtree model logout
  proofs:
  - tests/techtree/test_model_sign_in.py
  regressions:
  - id: R-20261018-deep-oauth-error
    from: 'review of 6570fcd: a refused sign-in body nested too deep crashed login'
    test: tests/techtree/test_model_sign_in.py
  - id: R-20261019-model-sign-in-state
    from: 'review of 026fda3: nothing checked an answer for another attempt or where logout revokes'
    test: tests/techtree/test_model_sign_in.py
  gaps:
  - model login, status and logout are proven against a stand-in for OpenAI only.
- id: techtree-model-substitution
  what: An agent describes an OBLITERATUS checkpoint and the Hugging Face snapshot it was made from as
    the two model blocks of a model substitution pair, and checks that an operator's vLLM server serves
    a block's model.
  who: agent
  level: ordinary
  paths:
  - src/regents_cli/techtree/model_files.py
  - src/regents_cli/techtree/model_server.py
  - src/regents_cli/techtree/obliteratus.py
  - src/regents_cli/techtree/models/open_weights.py
  entry:
  - cli: regents techtree model import-obliteratus <checkpoint> --source <snapshot>
  - cli: regents techtree model check-server --block <file> --base-url <url>
  proofs:
  - tests/techtree/test_model_files.py
  - tests/techtree/test_obliteratus_import.py
  - tests/techtree/test_model_server.py
  gaps:
  - Proven on hand-made checkpoints only, not yet on a real OBLITERATUS export.
  - check-server is proven against a stand-in for vLLM's two reads, not a real vLLM.
  - 'No run uses the pair yet: the model substitution Campaign, its run on the open_weights route, and
    its proof bundle are the next build.'
- id: techtree-approval
  what: Before a Techtree step that needs agreement, the agent shows its person the review and runs the
    step only once they agree.
  who: agent
  level: ordinary
  paths:
  - src/regents_cli/techtree/approval.py
  entry:
  - cli: regents techtree publish
  - cli: regents techtree withdraw
  proofs:
  - tests/techtree/test_approval.py
- id: techtree-publication
  what: An agent publishes a finished run to Techtree's public log or withdraws it, signed and sent once,
    and reads published runs and Skills back from the site.
  who: agent
  level: protected
  paths:
  - src/regents_cli/techtree/publication/**
  - src/regents_cli/techtree/site.py
  entry:
  - cli: regents techtree publish
  - cli: regents techtree withdraw
  proofs:
  - tests/techtree/test_publish_command.py
  - tests/techtree/test_publication_auth.py
  - tests/techtree/test_published_skill.py
  gaps:
  - Publishing is proven against a stand-in for techtree.sh only.
- id: techtree-release
  what: The Techtree release this build belongs to, and whether it holds.
  who: operator
  level: ordinary
  paths:
  - src/regents_cli/techtree/release/**
  - src/regents_cli/techtree/resources/release/**
  - scripts/techtree/release-inputs.json
  - scripts/techtree/build_release_*.py
  - scripts/techtree/verify_release_core.py
  entry:
