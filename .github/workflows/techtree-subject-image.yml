name: Techtree subject image

# Publishes the image Hello World's subject agent runs in. Run by hand; the Campaign pins the
# digest this prints, so publishing a new one changes nothing until the catalog is rebuilt.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: scripts/techtree/subject-image
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: ghcr.io/regents-ai/techtree-subject:hermes-v2026.7.20
      - run: docker buildx imagetools inspect "ghcr.io/regents-ai/techtree-subject@${{ steps.build.outputs.digest }}"
