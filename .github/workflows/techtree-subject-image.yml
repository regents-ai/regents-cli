name: Techtree subject image

# Publishes one of the images a Climb's subject agent runs in: `subject-image` for Hello World,
# `subject-image-cpp` for Frontier-CS Open-Ended. Run by hand; each Campaign pins the digest this
# prints, so publishing a new one changes nothing until the catalog is rebuilt.
on:
  workflow_dispatch:
    inputs:
      recipe:
        description: The directory under scripts/techtree to build
        type: choice
        options:
          - subject-image
          - subject-image-cpp

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          RECIPE: ${{ inputs.recipe }}
        run: |
          case "$RECIPE" in
            subject-image) echo "tag=hermes-v2026.7.20" >> "$GITHUB_OUTPUT" ;;
            subject-image-cpp) echo "tag=hermes-v2026.7.20-gcc" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: scripts/techtree/${{ inputs.recipe }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: ghcr.io/regents-ai/techtree-subject:${{ steps.tag.outputs.tag }}
      - run: docker buildx imagetools inspect "ghcr.io/regents-ai/techtree-subject@${{ steps.build.outputs.digest }}"
