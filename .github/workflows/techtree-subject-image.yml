name: Techtree subject image

# Publishes one of the images a Climb's subject agent runs in: `subject-image` for Hello World,
# `subject-image-cpp` for Frontier-CS Open-Ended. Run by hand; each Campaign pins the digest this
# prints, so publishing a new one changes nothing until the catalog is rebuilt.
on:
  workflow_dispatch:
    inputs:
      recipe:
        description: The directory under scripts/techtree to build
        type: choice
        options:
          - subject-image
          - subject-image-cpp

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: tag
        env:
          RECIPE: ${{ inputs.recipe }}
        run: |
          case "$RECIPE" in
            subject-image) echo "tag=hermes-v2026.9.24" >> "$GITHUB_OUTPUT" ;;
            subject-image-cpp) echo "tag=hermes-v2026.9.24-gcc" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: scripts/techtree/${{ inputs.recipe }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: ghcr.io/regents-ai/techtree-subject:${{ steps.tag.outputs.tag }}
      - run: docker buildx imagetools inspect "ghcr.io/regents-ai/techtree-subject@${{ steps.build.outputs.digest }}"
