name: Publish to PyPI

# Publishes the wheel for the version in pyproject.toml, then tags the published commit
# `v<version>` (Techtree's release record reads the CLI from that tag). Run by hand, on main, with
# the founder's go. PyPI trusts this workflow and the `pypi` environment directly, so no token is
# stored. Wheel only: the build stamps its source commit from git, which a source archive would lack.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: make check
      - run: uv build --wheel --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "regents-cli $version" "$GITHUB_SHA"
          git push origin "v$version"
