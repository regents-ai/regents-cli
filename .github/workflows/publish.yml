name: Publish to PyPI

# Publishes the wheel for the version in pyproject.toml, then tags the published commit
# `v<version>` (Techtree's release record reads the CLI from that tag). Run by hand, on main, with
# the founder's go. PyPI trusts this workflow and the `pypi` environment directly, so no token is
# stored. Wheel only: the build stamps its source commit from git, which a source archive would lack.
on:
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The feature map's check compares against the last release tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-extras
      # `regents browser`'s tests drive a sandboxed Chromium; Ubuntu blocks its sandbox by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv run playwright install --with-deps chromium
      - run: make check
      - run: uv build --wheel --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wheel
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "regents-cli $version" "$GITHUB_SHA"
          git push origin "v$version"
