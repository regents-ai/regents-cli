version: 1
repo: regents-cli
owner: regents-cli
path: regents-cli
release_group: public_beta
owns:
  - operator_control_surface
  - generated_bindings
  - local_runtime
  - portfolio_release_checks
source_of_truth:
  repo_contract: repo.yaml
  http_contracts:
    - docs/regent-services-contract.openapiv3.yaml
  cli_contracts:
    - docs/shared-cli-contract.yaml
  shared_contracts: []
  runtime_contracts:
    - docs/json-rpc-methods.yaml
  chain_contracts: []
code_map:
  - path: packages/regents-cli/src/routes
    owns: command_dispatch
  - path: packages/regents-cli/src/internal-runtime
    owns: local_runtime
  - path: scripts
    owns: contract_and_meta_checks
local_path_dependencies: []
acceptance_commands:
  - cwd: .
    command: pnpm check:workspace
  - cwd: .
    command: pnpm check:openapi
  - cwd: .
    command: pnpm check:cli-contract
  - cwd: .
    command: pnpm build
  - cwd: .
    command: pnpm typecheck
  - cwd: .
    command: pnpm test
  - cwd: .
    command: pnpm test:pack-smoke
