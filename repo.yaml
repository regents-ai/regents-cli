version: 1
repo: regents-cli
owner: regents-cli
path: regents-cli
release_group: public_beta
owns:
  - regents_command_line
  - site_command_descriptions_format
source_of_truth:
  cli_contracts:
    - src/regents_cli/schemas/commands.v1.json
  pinned_platforms: platforms.lock.json
code_map:
  - path: src/regents_cli
    owns: command_line
  - path: scripts
    owns: pin_sync_and_packaging_checks
local_path_dependencies: []
acceptance_commands:
  - cwd: .
    command: make check
