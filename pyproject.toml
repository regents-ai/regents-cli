[project]
name = "regents-cli"
version = "1.0.0.dev0"
description = "The regents command: every Regents Labs site from one command line."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Regents Labs" }]
keywords = ["regents", "cli", "agents"]
dependencies = [
  "click>=8.2,<9",
  "cryptography>=50.0.1,<51",
  "eth-account>=0.13,<1",
  "filelock>=3.18,<4",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "rfc8785>=0.1,<1",
  "rich>=14,<16",
]

[project.optional-dependencies]
# What a site's `make check-cli` needs to run regents_cli.check_commands.
check = [
  "jsonschema>=4.25,<5",
  "pyyaml>=6,<7",
]

[project.scripts]
regents = "regents_cli.app:run"

[project.urls]
Homepage = "https://github.com/regents-ai/regents-cli"
Issues = "https://github.com/regents-ai/regents-cli/issues"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9.1.1,<10",
  "ruff>=0.12,<1",
  "types-pyyaml>=6,<7",
  "types-jsonschema>=4.25,<5",
  "hatchling>=1.27,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regents_cli"]
# The source-commit stamp is gitignored, so hatchling only packages it when named here.
artifacts = ["src/regents_cli/techtree/resources/release/build-provenance.json"]

# Stamps the source commit into the wheel; refuses a tree that differs from it.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/stamp_provenance.py"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]
# Techtree's engine bundle is hashed byte for byte into every run; it is never reformatted.
extend-exclude = ["src/regents_cli/techtree/resources"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]
mypy_path = ["src"]
# The engine bundle imports Verifiers, which lives only in the engine's own environment.
exclude = ["^src/regents_cli/techtree/resources/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
