[project]
name = "regents-cli"
version = "1.0.0.dev0"
description = "The regents command: every Regents Labs site from one command line."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Regents Labs" }]
keywords = ["regents", "cli", "agents"]
dependencies = [
  "click>=8.2,<9",
  "httpx>=0.28,<1",
  "rich>=14,<16",
]

[project.optional-dependencies]
# What a site's `make check-cli` needs to run regents_cli.check_commands.
check = [
  "jsonschema>=4.25,<5",
  "pyyaml>=6,<7",
]

[project.scripts]
regents = "regents_cli.app:run"

[project.urls]
Homepage = "https://github.com/regents-ai/regents-cli"
Issues = "https://github.com/regents-ai/regents-cli/issues"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
  "types-pyyaml>=6,<7",
  "types-jsonschema>=4.25,<5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regents_cli"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
mypy_path = ["src"]
